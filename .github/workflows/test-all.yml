# Workflow settings
# See https://docs.github.com/en/actions/learn-github-actions/workflow-syntax-for-github-actions

name: Test DemoApps

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  # GitHub cron does not support an every-two-weeks interval directly.
  # Trigger weekly and let ci-gate select alternating weeks from a fixed anchor.
  schedule:
    - cron: '17 6 * * 1'

concurrency:
  group: CI-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci-gate:
    runs-on: ubuntu-latest
    outputs:
      run_ci: ${{ steps.decide.outputs.run_ci }}
    steps:
      - name: Decide whether CI should run
        id: decide
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "run_ci=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 2026-09-21 is the first scheduled Monday after this workflow was added.
          # The weekly cron fires every Monday, while this epoch-based parity check
          # runs the full matrix only every 14 days (including across year boundaries).
          anchor_epoch=$(date -u -d '2026-09-21 00:00:00 UTC' +%s)
          now_epoch=$(date -u +%s)
          weeks_since_anchor=$(( (now_epoch - anchor_epoch) / (7 * 24 * 60 * 60) ))

          if (( weeks_since_anchor % 2 == 0 )); then
            echo "run_ci=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_ci=false" >> "$GITHUB_OUTPUT"
            echo "Skipping this week's scheduled run; full CI runs every other week."
          fi

  test-unix:
    needs: ci-gate
    if: needs.ci-gate.outputs.run_ci == 'true'
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - os: ubuntu-24.04
            compiler: gcc-13
            cxx: g++-13
            mode: Release
            python: '3.10'
          - os: ubuntu-24.04
            compiler: gcc-13
            cxx: g++-13
            mode: Debug
            python: '3.10'
          - os: ubuntu-24.04
            compiler: clang-18
            cxx: clang++-18
            mode: Release
            python: '3.10'
          - os: ubuntu-24.04
            compiler: clang-18
            cxx: clang++-18
            mode: Debug
            python: '3.10'
          - os: macos-14
            compiler: appleclang
            cxx: clang++
            mode: Release
            python: '3.10'
          - os: macos-14
            compiler: appleclang
            cxx: clang++
            mode: Debug
            python: '3.10'

    runs-on: ${{ matrix.os }}

    env:
      CXX: ${{ matrix.cxx }}
      DEMOAPPS_HOME: ${{ github.workspace }}
      BUILD_DIR: ${{ runner.temp }}/pressio-demoapps-build

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install pinned Linux compilers
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-13 clang-18

      - name: Check environment
        shell: bash
        run: |
          echo "OS: ${{ runner.os }}"
          echo "Compiler configuration: ${{ matrix.compiler }}"
          "$CXX" --version
          python --version
          cmake --version
          git --version

      - name: Install Python test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest build numpy scipy matplotlib

      - name: Configure C++ tests
        shell: bash
        run: |
          cmake \
            -S "$DEMOAPPS_HOME" \
            -B "$BUILD_DIR" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_BUILD_TYPE:STRING=${{ matrix.mode }} \
            -DPRESSIODEMOAPPS_ENABLE_TESTS:BOOL=ON \
            -DPRESSIODEMOAPPS_ENABLE_BINDINGS:BOOL=OFF \
            -DCMAKE_CXX_FLAGS="-Wall -Wno-unused-but-set-variable -Werror"

      - name: Build C++ tests
        shell: bash
        run: cmake --build "$BUILD_DIR" --parallel 2

      - name: Run C++ tests
        shell: bash
        run: ctest --test-dir "$BUILD_DIR" --parallel 2 --output-on-failure

      - name: Build and install Python package
        shell: bash
        run: |
          python cmake_build.py --build_mode=${{ matrix.mode }}
          python -m pip install .

      - name: Run Python tests
        shell: bash
        run: python -m pytest -s

  test-windows:
    needs: ci-gate
    if: needs.ci-gate.outputs.run_ci == 'true'
    strategy:
      fail-fast: false
      matrix:
        mode: [Release, Debug]

    runs-on: windows-2022

    env:
      CXX: cl.exe
      DEMOAPPS_HOME: ${{ github.workspace }}
      BUILD_DIR: ${{ runner.temp }}/pressio-demoapps-build

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Check environment
        shell: pwsh
        run: |
          Write-Host "OS: ${{ runner.os }}"
          cl.exe
          python --version
          cmake --version
          git --version

      - name: Install Python test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest build numpy scipy matplotlib

      - name: Configure C++ tests
        shell: pwsh
        run: cmake -S "$env:DEMOAPPS_HOME" -B "$env:BUILD_DIR" -DPRESSIODEMOAPPS_ENABLE_TESTS:BOOL=ON -DPRESSIODEMOAPPS_ENABLE_BINDINGS:BOOL=OFF -DCMAKE_CXX_FLAGS="/W4"

      - name: Build C++ tests
        shell: pwsh
        run: cmake --build "$env:BUILD_DIR" --config ${{ matrix.mode }} --parallel 2

      - name: Run C++ tests
        shell: pwsh
        run: ctest --test-dir "$env:BUILD_DIR" -C ${{ matrix.mode }} --parallel 2 --output-on-failure

      - name: Build and install Python package
        shell: pwsh
        run: |
          python cmake_build.py --build_mode=${{ matrix.mode }}
          python -m pip install .

      - name: Run Python tests
        shell: pwsh
        run: python -m pytest -s

  test-python-versions:
    needs: ci-gate
    if: needs.ci-gate.outputs.run_ci == 'true'
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11']

    runs-on: ubuntu-24.04

    env:
      CXX: g++-13

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install GCC 13
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-13

      - name: Install Python test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest build numpy scipy matplotlib

      - name: Build and install Python package
        shell: bash
        run: |
          python cmake_build.py --build_mode=Release
          python -m pip install .

      - name: Run Python tests
        shell: bash
        run: python -m pytest -s
